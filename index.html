<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RetroSnake Deluxe - Fixed Loop Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Cinzel:wght@700&family=Fira+Code:wght@700&family=Inter:wght@400;700;900&family=Montserrat:wght@800&family=Orbitron:wght@700;900&family=Press+Start+2P&family=Rajdhani:wght@700&family=Roboto+Mono:wght@700&family=VT323&display=swap" rel="stylesheet">

    <!-- Firebase SDKs for Global Real-Time Leaderboard -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #050811;
            --card-bg: rgba(18, 25, 39, 0.65);
            --card-border: 1px solid rgba(255, 255, 255, 0.12);
            --card-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
            --card-backdrop: blur(16px);
            --accent: #f1f2f6;
            --accent-glow: rgba(241, 242, 246, 0.4);
            --secondary-accent: #0056b3;
            --text: #f0f6fc;
            --theme-font: 'Roboto Mono', monospace;
            --btn-bg: linear-gradient(180deg, #f1f2f6 0%, #0056b3 100%);
            --btn-shadow: 0 5px 0 #003d80, 0 8px 10px rgba(0,0,0,0.5);
            --btn-border: 1px solid rgba(255,255,255,0.4);
            --btn-radius: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--theme-font);
            user-select: none;
            transition: font-family 0.3s ease, background 0.3s ease, border 0.3s ease, box-shadow 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            padding: 15px 10px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            position: relative;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            filter: blur(40px);
            pointer-events: none;
        }

        .single-column-app {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            z-index: 1;
        }

        .card {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: var(--card-backdrop);
            -webkit-backdrop-filter: var(--card-backdrop);
            border: var(--card-border);
            border-radius: 20px;
            padding: 16px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header {
            text-align: center;
        }

        .logo {
            font-size: clamp(1.4rem, 5vw, 2rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--accent), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            font-size: clamp(0.9rem, 3.5vw, 1.2rem);
            font-weight: 700;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-item span {
            color: var(--accent);
        }

        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            border: var(--card-border);
            touch-action: none;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background-color: #000;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(7, 10, 18, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }

        .hidden { display: none !important; }

        .btn {
            background: var(--btn-bg);
            color: #fff;
            border: var(--btn-border);
            padding: 12px 20px;
            border-radius: var(--btn-radius);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.2s ease, box-shadow 0.2s ease;
            box-shadow: var(--btn-shadow);
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active { transform: scale(0.95); }

        .btn-pause {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }

        .dpad-container {
            display: grid;
            /* Equal-fraction columns guarantee identical button widths regardless of
               viewport size — this is what preserves muscle memory across devices. */
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 1fr;
            gap: 8px;
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
            touch-action: manipulation; /* blocks double-tap-to-zoom / pinch on the pad */
        }

        .dpad-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text);
            font-size: 1.4rem;
            /* Fixed height (not min-height) so all four buttons stay pixel-identical
               regardless of content, and satisfies the ~44px minimum touch target. */
            height: 55px;
            width: 100%;
            padding: 0;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--btn-shadow);
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none; /* prevent iOS long-press callout/selection menu */
            outline: none;
            transition: background 0.06s ease, transform 0.06s ease;
        }

        .dpad-btn:active,
        .dpad-btn.is-pressed {
            background: var(--accent);
            color: #000;
            transform: scale(0.93);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8b949e;
        }

        .select-input, .text-input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 10px;
            outline: none;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 14px;
            border-radius: 12px;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        @media (max-width: 400px) {
            body { padding: 8px 5px; }
            .card { padding: 12px; gap: 10px; }
            .dpad-btn { height: 48px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="single-column-app">

    <div class="card header">
        <div class="logo">Snake Motion HD</div>
        <div class="stats-bar">
            <div class="stat-item">Score: <span id="currentScore">0</span></div>
            <div class="stat-item">High Score: <span id="highScore">0</span></div>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        
        <div id="gameOverlay" class="overlay">
            <h1 id="overlayTitle" style="font-size: clamp(1.6rem, 6vw, 2.2rem); text-shadow: 0 0 10px var(--accent-glow);">READY PLAYER ONE</h1>
            <p id="overlaySub" style="color: #8b949e; font-size: 0.9rem;">Ultra Organic Snake • Real-time Dynamics</p>
            <button class="btn" onclick="startGame()">Start Game</button>
        </div>

        <div id="pauseOverlay" class="overlay hidden">
            <h1 style="font-size: 2.2rem; text-shadow: 0 0 10px var(--accent-glow);">GAME PAUSED</h1>
            <p style="color: #8b949e; font-size: 0.9rem;">Take a breather...</p>
            <button class="btn" onclick="togglePause()">Resume Game</button>
        </div>

        <div id="authModal" class="overlay hidden">
            <h2>Select Profile</h2>
            <input type="text" id="usernameInput" class="text-input" placeholder="Enter Username..." style="width: 85%;">
            <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
                <button class="btn" onclick="loginUser()">Save Login</button>
                <button class="btn btn-secondary" onclick="loginGuest()">Guest Mode</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; gap: 10px;">
            <button id="pauseBtn" class="btn btn-pause" style="flex: 1;" onclick="togglePause()">⏸ Pause Game</button>
            <button id="musicToggleBtn" class="btn btn-secondary btn-pause" style="flex: 0 0 55px; padding: 14px 0;" onclick="toggleMusic()" title="Toggle Music">🎵</button>
        </div>

        <div class="label" style="text-align: center; margin-top: 4px;">Controls</div>
        <div class="dpad-container" id="dpadContainer">
            <div></div>
            <button class="dpad-btn" data-dx="0" data-dy="-1" aria-label="Up">▲</button>
            <div></div>
            <button class="dpad-btn" data-dx="-1" data-dy="0" aria-label="Left">◄</button>
            <button class="dpad-btn" data-dx="0" data-dy="1" aria-label="Down">▼</button>
            <button class="dpad-btn" data-dx="1" data-dy="0" aria-label="Right">►</button>
        </div>
    </div>

    <div class="card">
        <div class="user-row">
            <span>Player: <strong id="userDisplayName">Guest</strong></span>
            <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;" onclick="toggleAuthModal()">Switch User</button>
        </div>

        <div class="control-group">
            <label class="label" for="difficultySelect">Speed & Difficulty</label>
            <select id="difficultySelect" class="select-input" onchange="changeDifficulty()">
                <option value="easy">Easy (Relaxed)</option>
                <option value="medium" selected>Medium (Classic)</option>
                <option value="hard">Hard (Insane Speed)</option>
            </select>
        </div>

        <div class="control-group">
            <label class="label" for="themeSelect">Theme & Morphism Style</label>
            <select id="themeSelect" class="select-input" onchange="applyTheme(this.value)"></select>
        </div>

        <div class="control-group">
            <label class="label" for="musicSelect">🎧 Soundtrack</label>
            <select id="musicSelect" class="select-input" onchange="changeMusicTrack()"></select>
        </div>

        <div class="control-group">
            <label class="label" for="musicVolume">Music Volume</label>
            <input type="range" id="musicVolume" min="0" max="100" value="50" oninput="changeMusicVolume(this.value)" style="width: 100%;">
        </div>
    </div>

    <div class="card">
        <div class="label" id="leaderboardLabel">🌐 Top Players</div>
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Player</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody">
                <tr><td colspan="3" style="text-align:center; color:#8b949e;">Loading scores...</td></tr>
            </tbody>
        </table>
        <div id="leaderboardNote" class="hidden" style="font-size: 0.75rem; color: #8b949e; text-align: center; line-height: 1.4;">
            Showing scores saved on this device only. 
        </div>
    </div>

</div>

<script>
/* --- WEB AUDIO SYNTHESIZER FOR SOUND FX --- */
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new AudioContext();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;
    
    if (type === 'turn') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.05);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
    } else if (type === 'eat') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'golden') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.18);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
    } else if (type === 'die') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(250, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
    }
}

/* --- PROCEDURAL BACKGROUND SOUNDTRACK ENGINE --- */
const NOTE_FREQS = {
    C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
    C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, R: 0
};

const musicTracks = {
    arcade: {
        name: "🕹️ Retro Arcade", tempo: 138, stepBeats: 0.5,
        bass: ['C3','R','C3','R','G3','R','G3','R','A3','R','A3','R','F3','R','G3','R'],
        lead: ['C4','E4','G4','E4','C4','E4','G4','C5','A4','C5','A4','G4','F4','A4','G4','E4']
    },
    synth: {
        name: "🌆 Neon Drift", tempo: 108, stepBeats: 0.5,
        bass: ['A3','R','A3','R','F3','R','F3','R','C3','R','C3','R','G3','R','E3','R'],
        lead: ['E4','R','C4','E4','R','C4','A3','R','F4','R','A4','R','G4','R','E4','R']
    },
    chill: {
        name: "☁️ Chill Bytes", tempo: 82, stepBeats: 0.5,
        bass: ['C3','R','R','R','G3','R','R','R','A3','R','R','R','F3','R','R','R'],
        lead: ['R','R','E4','R','R','R','D4','R','R','R','C4','R','R','G4','R','R']
    },
    boss: {
        name: "🔥 Boss Rush", tempo: 160, stepBeats: 0.5,
        bass: ['E3','R','E3','R','D3','R','D3','R','C3','R','C3','R','B3','R','B3','R'],
        lead: ['E4','G4','B4','G4','D4','F4','A4','F4','C4','E4','G4','E4','B3','D4','F4','D4']
    }
};

let musicEnabled = localStorage.getItem('snake_music_enabled') !== 'false';
let currentTrack = localStorage.getItem('snake_music_track') || 'arcade';
let musicVolume = parseFloat(localStorage.getItem('snake_music_volume') || '50');
let musicGain = null;
let stepIndex = 0;
let nextNoteTime = 0;
let schedulerTimer = null;
const SCHEDULE_AHEAD = 0.15;
const LOOKAHEAD_MS = 25;

function initMusicGain() {
    if (!audioCtx || musicGain) return;
    musicGain = audioCtx.createGain();
    musicGain.gain.value = (musicVolume / 100) * 0.35;
    musicGain.connect(audioCtx.destination);
}

function playMusicNote(freq, startTime, duration, type, peak) {
    if (!freq) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(g);
    g.connect(musicGain);
    g.gain.setValueAtTime(0.0001, startTime);
    g.gain.linearRampToValueAtTime(peak, startTime + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
}

function scheduler() {
    const track = musicTracks[currentTrack] || musicTracks.arcade;
    const stepTime = (60 / track.tempo) * track.stepBeats;

    while (nextNoteTime < audioCtx.currentTime + SCHEDULE_AHEAD) {
        const step = stepIndex % track.bass.length;
        const bassNote = track.bass[step];
        const leadNote = track.lead[step];

        if (bassNote !== 'R') playMusicNote(NOTE_FREQS[bassNote], nextNoteTime, stepTime * 0.9, 'triangle', 0.22);
        if (leadNote !== 'R') playMusicNote(NOTE_FREQS[leadNote], nextNoteTime, stepTime * 0.75, 'square', 0.13);

        nextNoteTime += stepTime;
        stepIndex++;
    }
    schedulerTimer = setTimeout(scheduler, LOOKAHEAD_MS);
}

function startScheduler() {
    if (!audioCtx || schedulerTimer) return;
    stepIndex = 0;
    nextNoteTime = audioCtx.currentTime + 0.05;
    scheduler();
}

function stopScheduler() {
    if (schedulerTimer) {
        clearTimeout(schedulerTimer);
        schedulerTimer = null;
    }
}

function shouldMusicPlay() {
    return musicEnabled && !(isRunning && isPaused);
}

function refreshMusicState() {
    if (!audioCtx) return;
    if (shouldMusicPlay()) {
        startScheduler();
    } else {
        stopScheduler();
    }
}

function toggleMusic() {
    initAudio();
    initMusicGain();
    musicEnabled = !musicEnabled;
    localStorage.setItem('snake_music_enabled', musicEnabled);
    document.getElementById('musicToggleBtn').innerText = musicEnabled ? '🎵' : '🔇';
    refreshMusicState();
}

function changeMusicTrack() {
    currentTrack = document.getElementById('musicSelect').value;
    localStorage.setItem('snake_music_track', currentTrack);
    if (schedulerTimer) {
        stopScheduler();
        startScheduler();
    }
}

function changeMusicVolume(val) {
    musicVolume = parseFloat(val);
    localStorage.setItem('snake_music_volume', musicVolume);
    if (musicGain) musicGain.gain.value = (musicVolume / 100) * 0.35;
}

function populateMusicTracks() {
    const select = document.getElementById('musicSelect');
    select.innerHTML = '';
    Object.keys(musicTracks).forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.innerText = musicTracks[key].name;
        select.appendChild(opt);
    });
    select.value = currentTrack;
}

/* --- DYNAMIC THEME-SENSITIVE BACKGROUND CANVAS --- */
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');

let activePrimaryColor = '#f1f2f6';
let activeSecondaryColor = '#0056b3';

function resizeBg() {
    bgCanvas.width = window.innerWidth;
    bgCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeBg);
resizeBg();

const bgOrbs = [];
for (let i = 0; i < 8; i++) {
    bgOrbs.push({
        x: Math.random() * bgCanvas.width,
        y: Math.random() * bgCanvas.height,
        radius: Math.random() * 250 + 150,
        vx: (Math.random() - 0.5) * 1.2,
        vy: (Math.random() - 0.5) * 1.2,
        useSecondary: i % 2 === 0
    });
}

function renderMainBackground() {
    bgCtx.fillStyle = '#050811';
    bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

    bgOrbs.forEach((orb) => {
        orb.x += orb.vx;
        orb.y += orb.vy;

        if (orb.x < -100 || orb.x > bgCanvas.width + 100) orb.vx *= -1;
        if (orb.y < -100 || orb.y > bgCanvas.height + 100) orb.vy *= -1;

        const orbColor = orb.useSecondary ? activeSecondaryColor : activePrimaryColor;

        const grad = bgCtx.createRadialGradient(orb.x, orb.y, 10, orb.x, orb.y, orb.radius);
        grad.addColorStop(0, orbColor + '55'); 
        grad.addColorStop(1, 'transparent');

        bgCtx.fillStyle = grad;
        bgCtx.beginPath();
        bgCtx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
        bgCtx.fill();
    });
}

/* --- GAME ENGINE & PROCEDURAL MAP THEMES --- */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GRID_CELLS = 22;
const CELL_SIZE = canvas.width / GRID_CELLS; 

let snake = [];
let food = { x: 0, y: 0, isGolden: false };
let dirX = 1, dirY = 0;
let inputQueue = [];
let score = 0;
let lastTickTime = 0;
let stepProgress = 0; 
let isRunning = false;
let isPaused = false;
let particles = [];
let floatingTexts = [];
let swallowBulges = []; 
let comboCount = 0;
let lastEatTime = 0;
let screenShakeTime = 0;
let animTime = 0;

let currentUser = localStorage.getItem('snake_user') || 'Guest';
let difficulties = { easy: 140, medium: 95, hard: 60 };
let currentDifficulty = 'medium';

const themes = [

/* --- FIREBASE WITH LOCAL FALLBACK ---
   To make the leaderboard truly WORLDWIDE (synced live across every player's
   device, anywhere), you need your own free Firebase project:
     1. Go to https://console.firebase.google.com and create a project (no cost
        on the free "Spark" plan for this amount of traffic).
     2. Enable "Firestore Database" (start in test mode, or lock it down with
        rules that allow create + read on the "leaderboard" collection).
     3. Project settings > General > "Your apps" > Web app > copy the config
        object and paste its values into firebaseConfig below, replacing the
        YOUR_... placeholders.
   Until real credentials are added, the game automatically falls back to a
   local, per-device leaderboard (stored in this browser's localStorage) so
   the feature still works out of the box — it just won't be shared between
   players until you connect Firebase. --- */
let db = null;
let firebaseActive = false;

const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};

try {
    if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        firebaseActive = true;
    }
} catch (e) {
    console.warn("Firebase initialization skipped, using local persistence.");
    firebaseActive = false;
}

function updateLeaderboardStatusUI() {
    const label = document.getElementById('leaderboardLabel');
    const note = document.getElementById('leaderboardNote');
    if (firebaseActive) {
        label.innerText = "🌐 Top Players (Worldwide)";
        note.classList.add('hidden');
    } else {
        label.innerText = "📍 Top Players (This Device)";
        note.classList.remove('hidden');
    }
}
updateLeaderboardStatusUI();

function saveScore(user, score) {
    if (score <= 0) return;
    
    const localHigh = parseInt(localStorage.getItem('snake_high_score') || '0', 10);
    if (score > localHigh) {
        localStorage.setItem('snake_high_score', score);
    }

    if (firebaseActive && db) {
        db.collection('leaderboard').add({
            user: user,
            score: score,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(err => console.warn("Cloud save failed", err));
    } else {
        loadLocalLeaderboard(user, score);
    }
}

function loadLeaderboard() {
    if (firebaseActive && db) {
        db.collection('leaderboard')
          .orderBy('score', 'desc')
          .limit(10)
          .onSnapshot(snapshot => {
              const body = document.getElementById('leaderboardBody');
              body.innerHTML = '';
              let index = 1;
              if (snapshot.empty) {
                  body.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#8b949e;">No high scores yet!</td></tr>`;
                  return;
              }
              snapshot.forEach(doc => {
                  const data = doc.data();
                  if (index === 1) document.getElementById('highScore').innerText = data.score;
                  body.innerHTML += `<tr><td>${index}</td><td>${data.user}</td><td>${data.score}</td></tr>`;
                  index++;
              });
          }, () => loadLocalLeaderboard());
    } else {
        loadLocalLeaderboard();
    }
}

function loadLocalLeaderboard(currentUser, newScore) {
    let localScores = JSON.parse(localStorage.getItem('snake_scores') || '[]');
    if (currentUser && newScore) {
        localScores.push({ user: currentUser, score: newScore });
        localScores.sort((a, b) => b.score - a.score);
        localScores = localScores.slice(0, 10);
        localStorage.setItem('snake_scores', JSON.stringify(localScores));
    }
    
    const body = document.getElementById('leaderboardBody');
    body.innerHTML = '';
    
    if (localScores.length === 0) {
        const topScore = localStorage.getItem('snake_high_score') || 0;
        document.getElementById('highScore').innerText = topScore;
        body.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#8b949e;">No high scores stored yet!</td></tr>`;
        return;
    }

    document.getElementById('highScore').innerText = localScores[0].score;
    localScores.forEach((item, idx) => {
        body.innerHTML += `<tr><td>${idx + 1}</td><td>${item.user}</td><td>${item.score}</td></tr>`;
    });
}

/* --- PROCEDURAL BACKGROUND GENERATION --- */
const starfieldStars = Array.from({ length: 60 }, () => ({
    x: Math.random() * 600,
    y: Math.random() * 600,
    size: Math.random() * 2 + 1,
    speed: Math.random() * 0.5 + 0.2
}));

const matrixDrops = Array.from({ length: 22 }, (_, i) => ({
    x: i * CELL_SIZE,
    y: Math.random() * 600,
    speed: Math.random() * 3 + 2
}));

const bubbleOrbs = Array.from({ length: 12 }, () => ({
    x: Math.random() * 600,
    y: Math.random() * 600,
    r: Math.random() * 30 + 15,
    vx: (Math.random() - 0.5) * 1.5,
    vy: (Math.random() - 0.5) * 1.5
}));

function drawProceduralBackground(type, accentColor) {
    ctx.fillStyle = "#070a12";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (type === "cyberGrid") {
        ctx.strokeStyle = accentColor + "22";
        ctx.lineWidth = 1;
        const offset = (animTime * 20) % CELL_SIZE;
        for (let x = 0; x <= canvas.width; x += CELL_SIZE) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = offset; y <= canvas.height; y += CELL_SIZE) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
    } 
    else if (type === "starfield") {
        ctx.fillStyle = accentColor;
        starfieldStars.forEach(s => {
            s.y = (s.y + s.speed) % canvas.height;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
        });
    } 
    else if (type === "waves") {
        ctx.strokeStyle = accentColor + "33";
        ctx.lineWidth = 2;
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            for (let x = 0; x <= canvas.width; x += 10) {
                const y = Math.sin((x * 0.01) + animTime + i) * 20 + (i * 120) + 60;
                if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
    } 
    else if (type === "matrixRain") {
        ctx.fillStyle = accentColor + "aa";
        ctx.font = "12px monospace";
        matrixDrops.forEach(d => {
            d.y = (d.y + d.speed) % canvas.height;
            const char = String.fromCharCode(0x30A0 + Math.floor(Math.random() * 96));
            ctx.fillText(char, d.x + 4, d.y);
        });
    } 
    else if (type === "floatingBubbles") {
        bubbleOrbs.forEach(b => {
            b.x += b.vx; b.y += b.vy;
            if (b.x < 0 || b.x > canvas.width) b.vx *= -1;
            if (b.y < 0 || b.y > canvas.height) b.vy *= -1;

            const grad = ctx.createRadialGradient(b.x, b.y, 2, b.x, b.y, b.r);
            grad.addColorStop(0, accentColor + "44");
            grad.addColorStop(1, "transparent");
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
        });
    } 
    else if (type === "radialPulse") {
        const radius = (Math.sin(animTime * 2) * 80) + 200;
        const grad = ctx.createRadialGradient(300, 300, 10, 300, 300, radius);
        grad.addColorStop(0, accentColor + "33");
        grad.addColorStop(1, "transparent");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
}

/* --- HAPTIC FEEDBACK PROFILES ---
   Each interaction gets a distinct shape so players can feel *what* happened
   without looking: a single short number = one crisp buzz; an array is a
   [vibrate, pause, vibrate, pause, ...] rhythm read by navigator.vibrate(). */
const HAPTIC_PATTERNS = {
    turn:      8,                      // instant, barely-there tick for direction changes
    eat:       [15, 30, 15],           // rhythmic double-pulse for a normal pickup
    golden:    [18, 25, 18, 25, 35],   // richer triple-pulse for the rare golden pickup
    collision: [70, 40, 90, 40, 130],  // long, heavy, escalating rumble for death
    start:     25                      // single confirming pulse when a run begins
};

let lastHapticAt = 0;
function triggerHaptic(pattern = 'turn') {
    if (!("vibrate" in navigator)) return;
    const value = typeof pattern === 'string' ? HAPTIC_PATTERNS[pattern] : pattern;
    if (value === undefined) return;

    // Guard against back-to-back calls (e.g. two quick turns) stomping on each
    // other's pattern before it can be felt.
    const now = performance.now();
    if (now - lastHapticAt < 8) return;
    lastHapticAt = now;

    try { navigator.vibrate(value); } catch (e) {}
}

function triggerScreenShake(duration = 0.2) {
    screenShakeTime = duration;
}

function addFloatingText(text, x, y, color = "#fff") {
    floatingTexts.push({
        text: text,
        x: x,
        y: y,
        vy: -1.2,
        alpha: 1.0,
        color: color
    });
}

function updateFloatingTexts() {
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.02;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
    }
}

function drawFloatingTexts() {
    floatingTexts.forEach(ft => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.font = "bold 16px var(--theme-font)";
        ctx.fillStyle = ft.color;
        ctx.shadowColor = "#000";
        ctx.shadowBlur = 6;
        ctx.textAlign = "center";
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
    });
}

function resetGame() {
    const startX = Math.floor(GRID_CELLS / 2);
    const startY = Math.floor(GRID_CELLS / 2);
    
    snake = [
        { x: startX, y: startY, prevX: startX - 1, prevY: startY },
        { x: startX - 1, y: startY, prevX: startX - 2, prevY: startY },
        { x: startX - 2, y: startY, prevX: startX - 3, prevY: startY },
        { x: startX - 3, y: startY, prevX: startX - 4, prevY: startY }
    ];
    dirX = 1; dirY = 0;
    inputQueue = [];
    score = 0;
    comboCount = 0;
    stepProgress = 0;
    isPaused = false;
    swallowBulges = [];
    floatingTexts = [];
    document.getElementById('currentScore').innerText = score;
    document.getElementById('pauseBtn').innerText = "⏸ Pause Game";
    document.getElementById('pauseOverlay').classList.add('hidden');
    spawnFood();
}

function startGame() {
    initAudio();
    initMusicGain();
    resetGame();
    document.getElementById('gameOverlay').classList.add('hidden');
    isRunning = true;
    lastTickTime = performance.now();
    triggerHaptic('start');
    refreshMusicState();
}

function togglePause() {
    if (!isRunning) return;
    initAudio();
    initMusicGain();
    isPaused = !isPaused;
    const pauseBtn = document.getElementById('pauseBtn');
    const pauseOverlay = document.getElementById('pauseOverlay');

    if (isPaused) {
        pauseBtn.innerText = "▶ Resume Game";
        pauseOverlay.classList.remove('hidden');
    } else {
        pauseBtn.innerText = "⏸ Pause Game";
        pauseOverlay.classList.add('hidden');
        lastTickTime = performance.now();
    }
    refreshMusicState();
}

function renderLoop(timestamp) {
    animTime += 0.015;

    renderMainBackground();

    if (isRunning && !isPaused) {
        const tickRate = difficulties[currentDifficulty];
        const elapsed = timestamp - lastTickTime;
        stepProgress = elapsed / tickRate;

        if (elapsed >= tickRate) {
            updateLogic();
            lastTickTime = timestamp;
            stepProgress = 0;
        }
    }

    updateParticles();
    updateFloatingTexts();
    drawGameMap();
    requestAnimationFrame(renderLoop);
}

function updateLogic() {
    if (inputQueue.length > 0) {
        const nextMove = inputQueue.shift();
        dirX = nextMove.x;
        dirY = nextMove.y;
    }

    const head = { ...snake[0] };
    let newX = (head.x + dirX + GRID_CELLS) % GRID_CELLS;
    let newY = (head.y + dirY + GRID_CELLS) % GRID_CELLS;

    const newHead = { x: newX, y: newY, prevX: head.x, prevY: head.y };

    if (checkCollision(newX, newY)) {
        handleGameOver();
        return;
    }

    snake.unshift(newHead);

    for (let i = 1; i < snake.length; i++) {
        snake[i].prevX = snake[i].x;
        snake[i].prevY = snake[i].y;
    }

    for (let i = swallowBulges.length - 1; i >= 0; i--) {
        swallowBulges[i].index += 0.35;
        if (swallowBulges[i].index >= snake.length) {
            swallowBulges.splice(i, 1);
        }
    }

    if (newX === food.x && newY === food.y) {
        const now = performance.now();
        if (now - lastEatTime < 2800) {
            comboCount++;
        } else {
            comboCount = 1;
        }
        lastEatTime = now;

        const basePoints = food.isGolden ? 30 : 10;
        const totalPoints = basePoints * comboCount;
        score += totalPoints;
        document.getElementById('currentScore').innerText = score;

        swallowBulges.push({ index: 0, scale: food.isGolden ? 1.6 : 1.35 });

        const foodPx = food.x * CELL_SIZE + CELL_SIZE / 2;
        const foodPy = food.y * CELL_SIZE + CELL_SIZE / 2;

        if (comboCount > 1) {
            addFloatingText(`+${totalPoints} COMBO x${comboCount}!`, foodPx, foodPy - 10, "#facc15");
        } else {
            addFloatingText(`+${totalPoints}`, foodPx, foodPy - 10, food.isGolden ? "#facc15" : "#55efc4");
        }

        createFoodParticles(food.x * CELL_SIZE, food.y * CELL_SIZE, food.isGolden);
        
        if (food.isGolden) {
            playSound('golden');
            triggerScreenShake(0.25);
            triggerHaptic('golden');
        } else {
            playSound('eat');
            triggerHaptic('eat');
        }
        
        spawnFood();
    } else {
        snake.pop();
    }
}

function spawnFood() {
    food = {
        x: Math.floor(Math.random() * GRID_CELLS),
        y: Math.floor(Math.random() * GRID_CELLS),
        isGolden: Math.random() < 0.2
    };
    if (snake.some(s => s.x === food.x && s.y === food.y)) {
        spawnFood();
    }
}

function checkCollision(x, y) {
    for (let i = 0; i < snake.length - 1; i++) {
        if (snake[i].x === x && snake[i].y === y) return true;
    }
    return false;
}

function handleGameOver() {
    isRunning = false;
    playSound('die');
    triggerScreenShake(0.4);
    triggerHaptic('collision');
    saveScore(currentUser, score);
    document.getElementById('overlayTitle').innerText = "GAME OVER";
    document.getElementById('overlaySub').innerText = `Final Score: ${score}`;
    document.getElementById('gameOverlay').classList.remove('hidden');
}

function drawGameMap() {
    const activeIndex = document.getElementById('themeSelect').value || 19;
    const theme = themes[activeIndex];

    ctx.save();

    if (screenShakeTime > 0) {
        screenShakeTime -= 0.016;
        const dx = (Math.random() - 0.5) * 8;
        const dy = (Math.random() - 0.5) * 8;
        ctx.translate(dx, dy);
    }

    drawProceduralBackground(theme.bgType, theme.accent);

    // --- RENDER DYNAMIC FOOD ---
    const foodX = food.x * CELL_SIZE + CELL_SIZE / 2;
    const foodY = food.y * CELL_SIZE + CELL_SIZE / 2;
    const floatBob = Math.sin(animTime * 6) * 3;
    const foodRadius = (CELL_SIZE / 2 - 4) + Math.sin(animTime * 4) * 1.5;
    const foodColor = food.isGolden ? "#facc15" : theme.food;

    ctx.shadowBlur = food.isGolden ? 22 : 14;
    ctx.shadowColor = foodColor;
    
    ctx.strokeStyle = foodColor + "88";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(foodX, foodY + floatBob, foodRadius + 4 + Math.sin(animTime * 8) * 2, 0, Math.PI * 2);
    ctx.stroke();

    const foodGrad = ctx.createRadialGradient(foodX - 2, foodY + floatBob - 2, 1, foodX, foodY + floatBob, foodRadius);
    foodGrad.addColorStop(0, "#ffffff");
    foodGrad.addColorStop(0.4, foodColor);
    foodGrad.addColorStop(1, foodColor + "dd");

    ctx.fillStyle = foodGrad;
    ctx.beginPath();
    ctx.arc(foodX, foodY + floatBob, Math.max(3, foodRadius), 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // --- CALCULATE ORGANIC SMOOTH SNAKE SEGMENT POSITIONS ---
    const totalSegments = snake.length;
    const interpPos = [];

    for (let i = 0; i < totalSegments; i++) {
        const seg = snake[i];
        let drawX, drawY;

        if (isRunning && !isPaused) {
            let dx = seg.x - seg.prevX;
            let dy = seg.y - seg.prevY;
            if (Math.abs(dx) > 1) dx = dx > 0 ? -1 : 1;
            if (Math.abs(dy) > 1) dy = dy > 0 ? -1 : 1;

            drawX = (seg.prevX + dx * Math.min(stepProgress, 1)) * CELL_SIZE + CELL_SIZE / 2;
            drawY = (seg.prevY + dy * Math.min(stepProgress, 1)) * CELL_SIZE + CELL_SIZE / 2;
        } else {
            drawX = seg.x * CELL_SIZE + CELL_SIZE / 2;
            drawY = seg.y * CELL_SIZE + CELL_SIZE / 2;
        }

        // Apply sinusoidal slithering wave perpendicular to motion with edge wrap normalization
        if (i > 0 && i < totalSegments - 1) {
            const wave = Math.sin(animTime * 8 - i * 0.55) * 2.2;
            let pX = snake[i - 1].x - snake[i + 1].x;
            let pY = snake[i - 1].y - snake[i + 1].y;

            if (pX > 1) pX -= GRID_CELLS;
            if (pX < -1) pX += GRID_CELLS;
            if (pY > 1) pY -= GRID_CELLS;
            if (pY < -1) pY += GRID_CELLS;

            const len = Math.hypot(pX, pY) || 1;
            drawX += (-pY / len) * wave;
            drawY += (pX / len) * wave;
        }

        interpPos.push({ x: drawX, y: drawY });
    }

    // --- ORGANIC SNAKE BODY CAPSULE RENDERING WITH WRAP-FIX ---
    for (let i = totalSegments - 1; i >= 0; i--) {
        const curr = interpPos[i];
        
        let scale = 1.0;
        if (i > 0) {
            const taperProgress = i / (totalSegments - 1);
            scale = 1.0 - (Math.pow(taperProgress, 1.2) * 0.35); 
        }

        swallowBulges.forEach(b => {
            const dist = Math.abs(b.index - i);
            if (dist < 1.5) {
                scale *= 1 + (1.5 - dist) * 0.25 * (b.scale - 1);
            }
        });

        const radius = Math.max(4, (CELL_SIZE / 2 - 2) * scale);

        ctx.save();
        ctx.fillStyle = i === 0 ? theme.head : theme.body;

        if (i === 0) {
            ctx.shadowBlur = 14;
            ctx.shadowColor = theme.head;
        }

        // Connect adjacent segments only if they are not wrapping across the screen edge
        if (i < totalSegments - 1) {
            const next = interpPos[i + 1];
            const segDistance = Math.hypot(next.x - curr.x, next.y - curr.y);

            // CELL_SIZE * 2 threshold prevents capsule stretching across map boundaries
            if (segDistance < CELL_SIZE * 2) {
                const angle = Math.atan2(next.y - curr.y, next.x - curr.x);
                
                ctx.beginPath();
                ctx.arc(curr.x, curr.y, radius, angle + Math.PI / 2, angle - Math.PI / 2);
                ctx.arc(next.x, next.y, radius * 0.9, angle - Math.PI / 2, angle + Math.PI / 2);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
                ctx.lineWidth = 1;
                ctx.stroke();
            } else {
                // Render clean rounded cap for segments wrapping around map boundary
                ctx.beginPath();
                ctx.arc(curr.x, curr.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }
        } else {
            ctx.beginPath();
            ctx.arc(curr.x, curr.y, radius, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
    }

    // --- SNAKE HEAD ANATOMY (EYES & FLICKERING TONGUE) ---
    if (totalSegments > 0) {
        const headPos = interpPos[0];
        const angle = Math.atan2(dirY, dirX);

        ctx.save();
        ctx.translate(headPos.x, headPos.y);
        ctx.rotate(angle);

        if (Math.sin(animTime * 12) > 0.35) {
            const tongueLen = 12 + Math.sin(animTime * 20) * 4;
            ctx.strokeStyle = "#ff4757";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(CELL_SIZE / 2 - 2, 0);
            ctx.lineTo(CELL_SIZE / 2 + tongueLen, 0);
            ctx.lineTo(CELL_SIZE / 2 + tongueLen + 4, -4);
            ctx.moveTo(CELL_SIZE / 2 + tongueLen, 0);
            ctx.lineTo(CELL_SIZE / 2 + tongueLen + 4, 4);
            ctx.stroke();
        }

        const eyeOffset = 6;
        const eyeRadius = 3.5;
        const pupilRadius = 1.8;

        const foodAngleWorld = Math.atan2(foodY - headPos.y, foodX - headPos.x);
        const relFoodAngle = foodAngleWorld - angle;
        const pupilX = Math.cos(relFoodAngle) * 1.2;
        const pupilY = Math.sin(relFoodAngle) * 1.2;

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(3, -eyeOffset, eyeRadius, 0, Math.PI * 2);
        ctx.arc(3, eyeOffset, eyeRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#050811";
        ctx.beginPath();
        ctx.arc(3 + pupilX, -eyeOffset + pupilY, pupilRadius, 0, Math.PI * 2);
        ctx.arc(3 + pupilX, eyeOffset + pupilY, pupilRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    drawFloatingTexts();

    ctx.restore();
}

function createFoodParticles(x, y, isGolden = false) {
    const activeIndex = document.getElementById('themeSelect').value || 19;
    const foodColor = isGolden ? "#facc15" : themes[activeIndex].food;
    const particleCount = isGolden ? 22 : 12;

    for (let i = 0; i < particleCount; i++) {
        particles.push({
            x: x + CELL_SIZE / 2,
            y: y + CELL_SIZE / 2,
            vx: (Math.random() - 0.5) * (isGolden ? 6 : 4),
            vy: (Math.random() - 0.5) * (isGolden ? 6 : 4),
            size: Math.random() * 3.5 + 2,
            color: foodColor,
            alpha: 1.0
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.035;
        if (p.alpha <= 0) particles.splice(i, 1);
    }
}

/* --- RESPONSIVE INPUT SYSTEM --- */
function setDirection(x, y) {
    if (!isRunning || isPaused) return;

    const lastDir = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : { x: dirX, y: dirY };

    if (x !== 0 && lastDir.x === 0) {
        if (inputQueue.length < 2) {
            inputQueue.push({ x: x, y: 0 });
            playSound('turn');
            triggerHaptic('turn');
        }
    }
    if (y !== 0 && lastDir.y === 0) {
        if (inputQueue.length < 2) {
            inputQueue.push({ x: 0, y: y });
            playSound('turn');
            triggerHaptic('turn');
        }
    }
}

function setupDpadControls() {
    const supportsPointer = typeof window.PointerEvent !== "undefined";

    document.querySelectorAll('.dpad-btn').forEach(btn => {
        const dx = parseInt(btn.dataset.dx, 10);
        const dy = parseInt(btn.dataset.dy, 10);

        const activate = (e) => {
            e.preventDefault();
            initAudio(); // unlocks/resumes the AudioContext on first real user gesture
            setDirection(dx, dy);
            btn.classList.add('is-pressed');
        };
        const release = () => btn.classList.remove('is-pressed');

        if (supportsPointer) {
            // pointerdown collapses mouse/touch/pen into one immediate event and
            // skips the ~300ms synthetic click delay some mobile browsers still add.
            btn.addEventListener('pointerdown', activate, { passive: false });
            btn.addEventListener('pointerup', release);
            btn.addEventListener('pointerleave', release);
            btn.addEventListener('pointercancel', release);
        } else {
            // Fallback for the rare engine without Pointer Events support.
            btn.addEventListener('touchstart', activate, { passive: false });
            btn.addEventListener('touchend', release);
            btn.addEventListener('touchcancel', release);
            btn.addEventListener('click', activate);
        }
    });
}

function setupSwipeControls() {
    let touchStartX = 0;
    let touchStartY = 0;
    const SWIPE_THRESHOLD = 18;

    const container = document.querySelector('.canvas-container');

    container.addEventListener('touchstart', e => {
        if (e.touches.length > 1) return;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, { passive: true });

    container.addEventListener('touchmove', e => {
        if (!isRunning || isPaused || !e.touches.length) return;
        
        let touchX = e.touches[0].clientX;
        let touchY = e.touches[0].clientY;
        
        let diffX = touchX - touchStartX;
        let diffY = touchY - touchStartY;

        if (Math.abs(diffX) > SWIPE_THRESHOLD || Math.abs(diffY) > SWIPE_THRESHOLD) {
            if (Math.abs(diffX) > Math.abs(diffY)) {
                setDirection(diffX > 0 ? 1 : -1, 0);
            } else {
                setDirection(0, diffY > 0 ? 1 : -1);
            }
            touchStartX = touchX;
            touchStartY = touchY;
        }
        if (e.cancelable) e.preventDefault();
    }, { passive: false });
}

window.addEventListener('keydown', e => {
    const key = e.key;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "w", "a", "s", "d", "W", "A", "S", "D", "h", "j", "k", "l"].includes(key)) {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(key)) {
            e.preventDefault();
        }
    }

    if (key === ' ' && !isRunning) startGame();
    else if ((key === ' ' || key === 'p' || key === 'P') && isRunning) togglePause();
    
    if (['ArrowUp', 'w', 'W', 'k', 'K', '8'].includes(key)) setDirection(0, -1);
    if (['ArrowDown', 's', 'S', 'j', 'J', '2'].includes(key)) setDirection(0, 1);
    if (['ArrowLeft', 'a', 'A', 'h', 'H', '4'].includes(key)) setDirection(-1, 0);
    if (['ArrowRight', 'd', 'D', 'l', 'L', '6'].includes(key)) setDirection(1, 0);
});

function changeDifficulty() {
    currentDifficulty = document.getElementById('difficultySelect').value;
    if (isRunning) startGame();
}

function updateUserDisplay() {
    document.getElementById('userDisplayName').innerText = currentUser;
}

function toggleAuthModal() {
    document.getElementById('authModal').classList.toggle('hidden');
}

function loginUser() {
    const input = document.getElementById('usernameInput').value.trim();
    if (input) {
        currentUser = input;
        localStorage.setItem('snake_user', currentUser);
        updateUserDisplay();
        toggleAuthModal();
    }
}

function loginGuest() {
    currentUser = 'Guest';
    localStorage.setItem('snake_user', 'Guest');
    updateUserDisplay();
    toggleAuthModal();
}

init();
</script>
